name: Crawl US PE After Market Close +10min
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run_crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python3 -m pip install requests

      - name: Run crawler
        run: python3 crawl.py
