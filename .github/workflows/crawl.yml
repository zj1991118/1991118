name: Crawl US PE Clean
on:
  workflow_dispatch:

jobs:
  run_crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl requests beautifulsoup4

      - name: Run clean crawl
        run: python crawl.py

      - name: Check if result exists
        id: check_file
        run: |
          if [ -f "pe_result.xlsx" ]; then
            echo "UPLOAD=yes" >> $GITHUB_ENV
          else
            echo "UPLOAD=no" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: env.UPLOAD == 'yes'
        with:
          name: 指数PE结果表
          path: pe_result.xlsx
