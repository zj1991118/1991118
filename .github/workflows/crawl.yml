name: Crawl US PE After Market Close +10min
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 定时：美股收盘后10分钟自动跑（UTC时间，你后面可以再调这个时间）
  schedule:
    - cron: '30 22 * * 1-5'

jobs:
  run_crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all required packages
        run: python3 -m pip install requests beautifulsoup4 openpyxl

      - name: Run crawler
        run: python3 crawl.py

      - name: Upload Excel file
        uses: actions/upload-artifact@v4
        with:
          name: 美股PE结果文件
          path: 美股PE.xlsx
